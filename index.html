<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pori & Jun Pixel Wardrobe (50 Outfits)</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --background: #f8f6f2;
      --card: #ffffff;
      --foreground: #261b16;
      --muted-foreground: #74645a;
      --border: #e5ddd4;
      --primary: #d96b38;
      --primary-foreground: #ffffff;
      --secondary: #f3ebe2;
      --secondary-foreground: #3a2a22;
    }
    html.dark {
      --background: #17171f;
      --card: #20212c;
      --foreground: #f2f1f6;
      --muted-foreground: #9ca0b4;
      --border: #323446;
      --primary: #f08a4b;
      --primary-foreground: #1a120d;
      --secondary: #2b2d3c;
      --secondary-foreground: #ebeaf2;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .pixelated {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .stage-canvas {
      cursor: grab;
      touch-action: none;
    }
    .stage-canvas.dragging {
      cursor: grabbing;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9999px; }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased m-0 p-4">
  <!-- WARDROBE_BUILD_VERSION: v1.0-ready -->
  <div class="max-w-7xl mx-auto space-y-4">
    <!-- Header -->
    <header class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-[var(--border)]">
      <div>
        <h1 class="text-lg font-bold tracking-tight text-[var(--foreground)] flex items-center gap-2">
          <span>👗</span>
          <span>포리 &amp; 준 도트 옷장</span>
          <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-[var(--secondary)] text-[var(--secondary-foreground)]">6 캐릭터 · 50벌</span>
        </h1>
        <p class="text-xs text-[var(--muted-foreground)] mt-0.5">
          세트 착용 / 옷·모자 믹스매치 · 캔버스에서 <b>모자 직접 드래그</b> 또는 <b>키보드 방향키(↑↓←→)</b>로 1px 단위 위치 조절!
        </p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button id="btnTheme" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-[var(--card)] text-[var(--foreground)] hover:opacity-90 border border-[var(--border)] cursor-pointer transition">🌙 다크모드</button>
        <button id="btnRandom" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90 border border-[var(--border)] cursor-pointer transition">
          🎲 랜덤 코디
        </button>
        <button id="btnUndress" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-[var(--card)] text-[var(--foreground)] hover:opacity-90 border border-[var(--border)] cursor-pointer transition">
          🧼 원본 나시로
        </button>
      </div>
    </header>

    <!-- Main 2-Column Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
      <!-- LEFT: Fitting Stage + Character Selector + Hat Position Controller -->
      <section class="lg:col-span-5 space-y-3 lg:sticky lg:top-4">
        <!-- Character Bar -->
        <div class="p-3 rounded-xl bg-[var(--card)] border border-[var(--border)] space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-[var(--muted-foreground)]">캐릭터 선택</span>
            <span id="activeCharLabel" class="text-xs font-bold text-[var(--foreground)]">호뽀리</span>
          </div>
          <div id="charBar" class="grid grid-cols-6 gap-1.5"></div>
        </div>

        <!-- Stage Canvas Card -->
        <div class="p-3 rounded-xl bg-[var(--card)] border border-[var(--border)] space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
            <div class="flex items-center gap-1">
              <span class="text-[var(--muted-foreground)] mr-1">배경</span>
              <button data-bg="checker" class="bg-btn px-2 py-0.5 rounded border border-[var(--border)] cursor-pointer">투명</button>
              <button data-bg="cream" class="bg-btn px-2 py-0.5 rounded border border-[var(--border)] cursor-pointer">크림</button>
              <button data-bg="sky" class="bg-btn px-2 py-0.5 rounded border border-[var(--border)] cursor-pointer">낮</button>
              <button data-bg="night" class="bg-btn px-2 py-0.5 rounded border border-[var(--border)] cursor-pointer">밤</button>
            </div>
            <div class="flex items-center gap-2">
              <label class="flex items-center gap-1 text-[var(--muted-foreground)] cursor-pointer select-none">
                <input id="chkGrid" type="checkbox" class="accent-[var(--primary)]" />
                격자
              </label>
              <select id="selZoom" class="text-xs rounded px-1.5 py-0.5 bg-[var(--background)] text-[var(--foreground)] border border-[var(--border)]">
                <option value="5">5×</option>
                <option value="6" selected>6×</option>
                <option value="7">7×</option>
              </select>
            </div>
          </div>

          <!-- Interactive Canvas Preview -->
          <div class="flex flex-col items-center justify-center rounded-lg border border-[var(--border)] bg-[var(--background)] p-3 overflow-hidden relative">
            <canvas id="stageCanvas" width="384" height="384" class="pixelated stage-canvas rounded"></canvas>
            <div id="dragHint" class="mt-2 text-xs text-[var(--muted-foreground)] flex items-center gap-2">
              <span id="wearingSummary" class="font-medium text-[var(--foreground)]">원본 나시</span>
            </div>
          </div>

          <!-- Hat Position Controller -->
          <div class="p-3 rounded-lg bg-[var(--background)] border border-[var(--border)] space-y-2.5">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="text-xs font-semibold text-[var(--foreground)]">🎩 모자 위치 조절</span>
                <span id="hatCoordBadge" class="text-xs font-mono px-2 py-0.5 rounded bg-[var(--secondary)] text-[var(--secondary-foreground)]">X: 0, Y: 0</span>
              </div>
              <div class="flex items-center gap-2">
                <label class="text-xs flex items-center gap-1 cursor-pointer select-none text-[var(--muted-foreground)]">
                  <input id="chkShowHat" type="checkbox" checked class="accent-[var(--primary)]" />
                  모자 표시
                </label>
              </div>
            </div>

            <div class="grid grid-cols-12 gap-3 items-center">
              <!-- D-Pad -->
              <div class="col-span-5 flex flex-col items-center gap-1">
                <button id="btnUp" title="위로 1px (↑)" class="w-9 h-7 text-xs font-bold rounded bg-[var(--card)] border border-[var(--border)] hover:bg-[var(--secondary)] cursor-pointer">▲</button>
                <div class="flex items-center gap-1">
                  <button id="btnLeft" title="왼쪽 1px (←)" class="w-9 h-7 text-xs font-bold rounded bg-[var(--card)] border border-[var(--border)] hover:bg-[var(--secondary)] cursor-pointer">◀</button>
                  <button id="btnResetHat" title="원위치 (0, 0)" class="w-9 h-7 text-xs font-bold rounded bg-[var(--secondary)] text-[var(--secondary-foreground)] border border-[var(--border)] hover:opacity-85 cursor-pointer">0</button>
                  <button id="btnRight" title="오른쪽 1px (→)" class="w-9 h-7 text-xs font-bold rounded bg-[var(--card)] border border-[var(--border)] hover:bg-[var(--secondary)] cursor-pointer">▶</button>
                </div>
                <button id="btnDown" title="아래로 1px (↓)" class="w-9 h-7 text-xs font-bold rounded bg-[var(--card)] border border-[var(--border)] hover:bg-[var(--secondary)] cursor-pointer">▼</button>
              </div>

              <!-- Sliders -->
              <div class="col-span-7 space-y-2 text-xs">
                <label class="block space-y-1">
                  <div class="flex justify-between text-[var(--muted-foreground)]">
                    <span>좌우 (X)</span>
                    <span id="valX" class="font-mono text-[var(--foreground)]">0px</span>
                  </div>
                  <input id="rngX" type="range" min="-16" max="16" value="0" class="w-full accent-[var(--primary)]" />
                </label>
                <label class="block space-y-1">
                  <div class="flex justify-between text-[var(--muted-foreground)]">
                    <span>상하 (Y)</span>
                    <span id="valY" class="font-mono text-[var(--foreground)]">0px</span>
                  </div>
                  <input id="rngY" type="range" min="-16" max="16" value="0" class="w-full accent-[var(--primary)]" />
                </label>
                <div class="flex items-center justify-between pt-0.5">
                  <label class="flex items-center gap-1 text-[var(--muted-foreground)] cursor-pointer select-none">
                    <input id="chkRememberOffset" type="checkbox" checked class="accent-[var(--primary)]" />
                    모자별 위치 기억
                  </label>
                  <button id="btnClearAllOffsets" class="text-xs text-[var(--muted-foreground)] underline hover:text-[var(--foreground)] cursor-pointer">저장 초기화</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Export Buttons -->
          <div class="grid grid-cols-3 gap-2 pt-1">
            <button id="btnSaveChar64" class="px-2 py-2 text-xs font-semibold rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90 cursor-pointer transition">
              💾 캐릭터 64px
            </button>
            <button id="btnSaveClothes64" class="px-2 py-2 text-xs font-semibold rounded-lg bg-[var(--secondary)] text-[var(--secondary-foreground)] border border-[var(--border)] hover:opacity-90 cursor-pointer transition">
              👕 의상만 64px
            </button>
            <button id="btnSaveBig" class="px-2 py-2 text-xs font-semibold rounded-lg bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] hover:bg-[var(--secondary)] cursor-pointer transition">
              🖼️ 8배 스냅샷
            </button>
          </div>
        </div>
      </section>

      <!-- RIGHT: 50-Outfit Closet Browser -->
      <section class="lg:col-span-7 p-3 rounded-xl bg-[var(--card)] border border-[var(--border)] space-y-3">
        <!-- Mode Tabs -->
        <div class="flex flex-wrap items-center justify-between gap-2 border-b border-[var(--border)] pb-2.5">
          <div class="flex items-center gap-1.5">
            <button data-mode="set" class="mode-tab px-3 py-1.5 text-xs font-semibold rounded-lg cursor-pointer transition">👗 세트 입히기</button>
            <button data-mode="body" class="mode-tab px-3 py-1.5 text-xs font-semibold rounded-lg cursor-pointer transition">👕 옷만 고르기</button>
            <button data-mode="hat" class="mode-tab px-3 py-1.5 text-xs font-semibold rounded-lg cursor-pointer transition">🎩 모자만 고르기</button>
          </div>
          <input id="txtSearch" type="text" placeholder="의상 이름·번호 검색..." class="text-xs px-2.5 py-1.5 rounded-lg bg-[var(--background)] text-[var(--foreground)] border border-[var(--border)] w-44 focus:outline-none" />
        </div>

        <!-- Category Filters -->
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div id="filterBar" class="flex flex-wrap items-center gap-1.5">
            <button data-cat="all" class="cat-btn px-2.5 py-1 text-xs rounded-full border border-[var(--border)] cursor-pointer">전체</button>
            <button data-cat="F" class="cat-btn px-2.5 py-1 text-xs rounded-full border border-[var(--border)] cursor-pointer">여자</button>
            <button data-cat="M" class="cat-btn px-2.5 py-1 text-xs rounded-full border border-[var(--border)] cursor-pointer">남자</button>
            <button data-cat="hanbok" class="cat-btn px-2.5 py-1 text-xs rounded-full border border-[var(--border)] cursor-pointer">한복</button>
            <button data-cat="fantasy" class="cat-btn px-2.5 py-1 text-xs rounded-full border border-[var(--border)] cursor-pointer">해적·판타지</button>
            <button data-cat="casual" class="cat-btn px-2.5 py-1 text-xs rounded-full border border-[var(--border)] cursor-pointer">일상·시즌</button>
          </div>
          <span id="countBadge" class="text-xs text-[var(--muted-foreground)] font-mono">50 items</span>
        </div>

        <!-- Outfit Grid -->
        <div id="closetGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2 max-h-[640px] overflow-y-auto pr-1"></div>
      </section>
    </div>
  </div>

      charId: "char06",
      bodyId: "ref22",

    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state.savedOffsets = JSON.parse(raw);
    } catch {}

    function offsetKey(charId, hatId) {
      return `${charId}__${hatId}`;
    }

    function saveCurrentOffset() {
      if (!state.rememberOffset || !state.hatId) return;
      state.savedOffsets[offsetKey(state.charId, state.hatId)] = { x: state.hatX, y: state.hatY };
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.savedOffsets)); } catch {}
    }

    function loadSavedOffsetOrZero() {
      if (state.rememberOffset && state.hatId) {
        const saved = state.savedOffsets[offsetKey(state.charId, state.hatId)];
        if (saved) {
          state.hatX = clamp(saved.x, -16, 16);
          state.hatY = clamp(saved.y, -16, 16);
          syncHatInputs();
          return;
        }
      }
      state.hatX = 0;
      state.hatY = 0;
      syncHatInputs();
    }

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function loadImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = src;
      });
    }

    async function preloadAll() {
      const jobs = [];
      for (const c of RAW_ASSETS.chars) {
        jobs.push(loadImage(c.src).then(img => { imgCache[c.id] = img; }));
      }
      for (const o of RAW_ASSETS.outfits) {
        jobs.push(loadImage(o.src).then(img => { imgCache[o.id] = img; }));
      }
      await Promise.all(jobs);
    }

    function compose64(includeChar) {
      const off = document.createElement("canvas");
      off.width = 64; off.height = 64;
      const ctx = off.getContext("2d");
      ctx.imageSmoothingEnabled = false;

        ctx.drawImage(imgCache[state.charId], 0, 0);
      }
      if (state.bodyId && imgCache[state.bodyId]) {
        // Draw ONLY body region y=30..63
        ctx.drawImage(imgCache[state.bodyId], 0, SPLIT_Y, 64, 64 - SPLIT_Y, 0, SPLIT_Y, 64, 64 - SPLIT_Y);
      }
      if (state.showHat && state.hatId && imgCache[state.hatId]) {
        // Draw ONLY hat region y=0..29 with user's exact integer X/Y offset!
        ctx.drawImage(imgCache[state.hatId], 0, 0, 64, SPLIT_Y, state.hatX, state.hatY, 64, SPLIT_Y);
      }
      return off;
    }

    const stageCanvas = document.getElementById("stageCanvas");
    const stageCtx = stageCanvas.getContext("2d");
    let isDragging = false;

    function drawStage() {
      const z = state.zoom;
      const size = 64 * z;
      if (stageCanvas.width !== size || stageCanvas.height !== size) {
        stageCanvas.width = size;
        stageCanvas.height = size;
      }
      stageCtx.imageSmoothingEnabled = false;

      // Background
      if (state.bg === "checker") {
        const isLight = !document.documentElement.classList.contains("dark");
        const c1 = isLight ? "#f0f0f6" : "#252630";
        const c2 = isLight ? "#e1e2ec" : "#1d1e27";
        const step = z * 4;
        for (let y = 0; y < size; y += step) {
          for (let x = 0; x < size; x += step) {
            stageCtx.fillStyle = ((x / step + y / step) % 2 === 0) ? c1 : c2;
            stageCtx.fillRect(x, y, step, step);
          }
        }
      } else if (state.bg === "cream") {
        stageCtx.fillStyle = "#FAF3E4";
        stageCtx.fillRect(0, 0, size, size);
      } else if (state.bg === "sky") {
        const grd = stageCtx.createLinearGradient(0, 0, 0, size);
        grd.addColorStop(0, "#7EC8F8");
        grd.addColorStop(1, "#DDF2FF");
        stageCtx.fillStyle = grd;
        stageCtx.fillRect(0, 0, size, size);
      } else if (state.bg === "night") {
        const grd = stageCtx.createLinearGradient(0, 0, 0, size);
        grd.addColorStop(0, "#141830");
        grd.addColorStop(1, "#2A244A");
        stageCtx.fillStyle = grd;
        stageCtx.fillRect(0, 0, size, size);
      }

      const comp = compose64(true);
      stageCtx.drawImage(comp, 0, 0, size, size);

      if (state.showGrid) {
        stageCtx.strokeStyle = "rgba(128,128,140,0.18)";
        stageCtx.lineWidth = 1;
        for (let i = 1; i < 64; i++) {
          stageCtx.beginPath(); stageCtx.moveTo(i * z + 0.5, 0); stageCtx.lineTo(i * z + 0.5, size); stageCtx.stroke();
          stageCtx.beginPath(); stageCtx.moveTo(0, i * z + 0.5); stageCtx.lineTo(size, i * z + 0.5); stageCtx.stroke();
        }
      }

      if (isDragging && state.showHat && state.hatId) {
        stageCtx.strokeStyle = "rgba(255, 196, 60, 0.85)";
        stageCtx.setLineDash([4, 3]);
        stageCtx.lineWidth = 1.5;
        stageCtx.strokeRect(state.hatX * z + 1, state.hatY * z + 1, 64 * z - 2, SPLIT_Y * z - 2);
        stageCtx.setLineDash([]);
      }

      updateWearingSummary();
    }

    function updateWearingSummary() {
      const charName = CHAR_META[state.charId]?.name || state.charId;
      document.getElementById("activeCharLabel").textContent = charName;
      const bodyName = state.bodyId ? (OUTFIT_META[state.bodyId]?.name || state.bodyId) : "원본 나시";
      const hatName = (state.showHat && state.hatId) ? (OUTFIT_META[state.hatId]?.name || state.hatId) : "모자 없음";
      document.getElementById("wearingSummary").textContent =
        (state.bodyId && state.bodyId === state.hatId && state.showHat)
          ? `착용 중: ${bodyName} (세트)`
          : `옷: ${bodyName} · 모자: ${hatName}`;
    }

    function syncHatInputs() {
      document.getElementById("rngX").value = state.hatX;
      document.getElementById("rngY").value = state.hatY;
      const sx = state.hatX > 0 ? `+${state.hatX}` : `${state.hatX}`;
      const sy = state.hatY > 0 ? `+${state.hatY}` : `${state.hatY}`;
      document.getElementById("valX").textContent = `${sx}px`;
      document.getElementById("valY").textContent = `${sy}px`;
      document.getElementById("hatCoordBadge").textContent = `X: ${sx}, Y: ${sy}`;
      document.getElementById("chkShowHat").checked = state.showHat;
    }

    function nudgeHat(dx, dy) {
      if (!state.hatId) return;
      state.showHat = true;
      state.hatX = clamp(state.hatX + dx, -16, 16);
      state.hatY = clamp(state.hatY + dy, -16, 16);
      saveCurrentOffset();
      syncHatInputs();
      drawStage();
    }

    function renderCharBar() {
      const bar = document.getElementById("charBar");
      bar.innerHTML = "";
      for (const c of RAW_ASSETS.chars) {
        const meta = CHAR_META[c.id] || { name: c.id };
        const active = state.charId === c.id;
        const btn = document.createElement("button");
        btn.className = `flex flex-col items-center p-1.5 rounded-lg border cursor-pointer transition ${
          active
            ? "bg-[var(--secondary)] border-[var(--primary)] ring-1 ring-[var(--primary)]"
            : "bg-[var(--background)] border-[var(--border)] hover:bg-[var(--secondary)]"
        }`;
        btn.innerHTML = `
          <img src="${c.src}" alt="${meta.name}" class="w-11 h-11 pixelated object-contain" />
          <span class="text-xs font-medium mt-0.5 truncate max-w-full">${meta.name}</span>
        `;
        btn.onclick = () => {
          state.charId = c.id;
          loadSavedOffsetOrZero();
          renderCharBar();
          drawStage();
        };
        bar.appendChild(btn);
      }
    }

    function makeThumbDataUrl(outfitId, mode) {
      const img = imgCache[outfitId];
      if (!img) return "";
      const c = document.createElement("canvas");
      c.width = 64; c.height = 64;
      const ctx = c.getContext("2d");
      ctx.imageSmoothingEnabled = false;
      if (mode === "hat") {
        // Center and slightly zoom hat region y=0..29 so hats are easy to see!
        ctx.drawImage(img, 4, 0, 56, 30, 0, 14, 64, 34);
      } else if (mode === "body") {
        ctx.drawImage(img, 10, 29, 44, 35, 6, 4, 52, 56);
      } else {
        ctx.drawImage(img, 0, 0);
      }
      return c.toDataURL();
    }

    function renderClosetGrid() {
      const grid = document.getElementById("closetGrid");
      grid.innerHTML = "";

      const q = state.search.trim().toLowerCase();
      let items = RAW_ASSETS.outfits.filter(o => {
        const m = OUTFIT_META[o.id] || { name: o.id, g: "F", cat: "casual" };
        if (state.mode === "hat" && !o.hasHat) return false;
        if (state.cat === "F" && m.g !== "F") return false;
        if (state.cat === "M" && m.g !== "M") return false;
        if (["hanbok", "fantasy", "casual"].includes(state.cat) && m.cat !== state.cat) return false;
        if (q && !m.name.toLowerCase().includes(q) && !o.id.toLowerCase().includes(q)) return false;
        return true;
      });

      document.getElementById("countBadge").textContent = `${items.length}벌`;

      // Add "모자 벗기" card at start of Hat mode
      if (state.mode === "hat") {
        const noneBtn = document.createElement("button");
        const activeNone = !state.hatId || !state.showHat;
        noneBtn.className = `flex flex-col items-center justify-center p-2 rounded-lg border cursor-pointer transition min-h-[108px] ${
          activeNone
            ? "bg-[var(--secondary)] border-[var(--primary)] ring-1 ring-[var(--primary)]"
            : "bg-[var(--background)] border-[var(--border)] hover:bg-[var(--secondary)]"
        }`;
        noneBtn.innerHTML = `<span class="text-xl mb-1">🚫</span><span class="text-xs font-medium">모자 벗기</span>`;
        noneBtn.onclick = () => {
          state.hatId = null;
          state.showHat = false;
          syncHatInputs();
          renderClosetGrid();
          drawStage();
        };
        grid.appendChild(noneBtn);
      }

      for (const o of items) {
        const m = OUTFIT_META[o.id] || { name: o.id, g: "F", cat: "casual" };
        const isSelected =
          (state.mode === "set" && state.bodyId === o.id && (!o.hasHat || state.hatId === o.id)) ||
          (state.mode === "body" && state.bodyId === o.id) ||
          (state.mode === "hat" && state.hatId === o.id && state.showHat);

        const card = document.createElement("button");
        card.className = `group relative flex flex-col items-center p-2 rounded-lg border cursor-pointer transition text-left ${
          isSelected
            ? "bg-[var(--secondary)] border-[var(--primary)] ring-1 ring-[var(--primary)]"
            : "bg-[var(--background)] border-[var(--border)] hover:bg-[var(--secondary)]"
        }`;
        const num = o.id.replace("ref", "#");
        const thumbSrc = makeThumbDataUrl(o.id, state.mode);
        card.innerHTML = `
          <span class="absolute top-1 left-1.5 text-[10px] font-mono text-[var(--muted-foreground)]">${num}</span>
          ${o.hasHat ? '<span class="absolute top-1 right-1.5 text-[10px]" title="모자 포함">🎩</span>' : ''}
          <img src="${thumbSrc}" alt="${m.name}" class="w-16 h-16 pixelated object-contain my-1" />
          <span class="text-xs font-medium text-center leading-tight line-clamp-2 w-full">${m.name}</span>
        `;
        card.onclick = () => {
          if (state.mode === "set") {
            state.bodyId = o.id;
            state.hatId = o.hasHat ? o.id : null;
            state.showHat = o.hasHat;
            loadSavedOffsetOrZero();
          } else if (state.mode === "body") {
            state.bodyId = o.id;
          } else if (state.mode === "hat") {
            state.hatId = o.id;
            state.showHat = true;
            loadSavedOffsetOrZero();
          }
          renderClosetGrid();
          drawStage();
        };
        grid.appendChild(card);
      }
    }

    function updateTabsAndFilters() {
      document.querySelectorAll(".mode-tab").forEach(btn => {
        const active = btn.dataset.mode === state.mode;
        btn.className = `mode-tab px-3 py-1.5 text-xs font-semibold rounded-lg cursor-pointer transition ${
          active
            ? "bg-[var(--primary)] text-[var(--primary-foreground)]"
            : "bg-[var(--background)] text-[var(--foreground)] border border-[var(--border)] hover:bg-[var(--secondary)]"
        }`;
      });
      document.querySelectorAll(".cat-btn").forEach(btn => {
        const active = btn.dataset.cat === state.cat;
        btn.className = `cat-btn px-2.5 py-1 text-xs rounded-full border cursor-pointer transition ${
          active
            ? "bg-[var(--secondary)] text-[var(--secondary-foreground)] border-[var(--primary)] font-semibold"
            : "bg-[var(--background)] text-[var(--muted-foreground)] border-[var(--border)] hover:text-[var(--foreground)]"
        }`;
      });
      document.querySelectorAll(".bg-btn").forEach(btn => {
        const active = btn.dataset.bg === state.bg;
        btn.className = `bg-btn px-2 py-0.5 rounded border cursor-pointer transition ${
          active
            ? "bg-[var(--secondary)] text-[var(--secondary-foreground)] border-[var(--primary)] font-semibold"
            : "bg-[var(--background)] text-[var(--muted-foreground)] border-[var(--border)]"
        }`;
      });
    }

    // Mouse / Touch Drag to move Hat on Canvas!
    let dragStartMouse = null;
    let dragStartHat = null;

    function getCanvasPos(e) {
      const rect = stageCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function onDragStart(e) {
      if (!state.showHat || !state.hatId) return;
      isDragging = true;
      stageCanvas.classList.add("dragging");
      dragStartMouse = getCanvasPos(e);
      dragStartHat = { x: state.hatX, y: state.hatY };
      drawStage();
    }

    function onDragMove(e) {
      if (!isDragging) return;
      e.preventDefault();
      const pos = getCanvasPos(e);
      const scale = stageCanvas.getBoundingClientRect().width / 64;
      const dx = Math.round((pos.x - dragStartMouse.x) / scale);
      const dy = Math.round((pos.y - dragStartMouse.y) / scale);
      const nx = clamp(dragStartHat.x + dx, -16, 16);
      const ny = clamp(dragStartHat.y + dy, -16, 16);
      if (nx !== state.hatX || ny !== state.hatY) {
        state.hatX = nx;
        state.hatY = ny;
        syncHatInputs();
        drawStage();
      }
    }

    function onDragEnd() {
      if (!isDragging) return;
      isDragging = false;
      stageCanvas.classList.remove("dragging");
      saveCurrentOffset();
      drawStage();
    }

    stageCanvas.addEventListener("mousedown", onDragStart);
    window.addEventListener("mousemove", onDragMove);
    window.addEventListener("mouseup", onDragEnd);
    stageCanvas.addEventListener("touchstart", onDragStart, { passive: false });
    window.addEventListener("touchmove", onDragMove, { passive: false });
    window.addEventListener("touchend", onDragEnd);

    // Keyboard Arrow Nudge
    window.addEventListener("keydown", (e) => {
      if (document.activeElement && document.activeElement.tagName === "INPUT") return;
      if (e.key === "ArrowUp")    { e.preventDefault(); nudgeHat(0, -1); }
      if (e.key === "ArrowDown")  { e.preventDefault(); nudgeHat(0,  1); }
      if (e.key === "ArrowLeft")  { e.preventDefault(); nudgeHat(-1, 0); }
      if (e.key === "ArrowRight") { e.preventDefault(); nudgeHat( 1, 0); }
    });

    // Buttons & Controls
    document.getElementById("btnUp").onclick    = () => nudgeHat(0, -1);
    document.getElementById("btnDown").onclick  = () => nudgeHat(0,  1);
    document.getElementById("btnLeft").onclick  = () => nudgeHat(-1, 0);
    document.getElementById("btnRight").onclick = () => nudgeHat( 1, 0);
    document.getElementById("btnResetHat").onclick = () => {
      state.hatX = 0; state.hatY = 0;
      saveCurrentOffset(); syncHatInputs(); drawStage();
    };
    document.getElementById("rngX").oninput = (e) => {
      state.hatX = parseInt(e.target.value, 10);
      saveCurrentOffset(); syncHatInputs(); drawStage();
    };
    document.getElementById("rngY").oninput = (e) => {
      state.hatY = parseInt(e.target.value, 10);
      saveCurrentOffset(); syncHatInputs(); drawStage();
    };
    document.getElementById("chkShowHat").onchange = (e) => {
      state.showHat = e.target.checked;
      renderClosetGrid(); drawStage();
    };
    document.getElementById("chkRememberOffset").onchange = (e) => {
      state.rememberOffset = e.target.checked;
    };
    document.getElementById("btnClearAllOffsets").onclick = () => {
      state.savedOffsets = {};
      try { localStorage.removeItem(STORAGE_KEY); } catch {}
      state.hatX = 0; state.hatY = 0;
      syncHatInputs(); drawStage();
    };
    document.getElementById("chkGrid").onchange = (e) => {
      state.showGrid = e.target.checked; drawStage();
    };
    document.getElementById("selZoom").onchange = (e) => {
      state.zoom = parseInt(e.target.value, 10); drawStage();
    };
    document.querySelectorAll(".mode-tab").forEach(btn => {
      btn.onclick = () => { state.mode = btn.dataset.mode; updateTabsAndFilters(); renderClosetGrid(); };
    });
    document.querySelectorAll(".cat-btn").forEach(btn => {
      btn.onclick = () => { state.cat = btn.dataset.cat; updateTabsAndFilters(); renderClosetGrid(); };
    });
    document.querySelectorAll(".bg-btn").forEach(btn => {
      btn.onclick = () => { state.bg = btn.dataset.bg; updateTabsAndFilters(); drawStage(); };
    });
    document.getElementById("txtSearch").oninput = (e) => {
      state.search = e.target.value; renderClosetGrid();
    };
    document.getElementById("btnRandom").onclick = () => {
      const list = RAW_ASSETS.outfits;
      const pick = list[Math.floor(Math.random() * list.length)];
      state.bodyId = pick.id;
      state.hatId = pick.hasHat ? pick.id : null;
      state.showHat = pick.hasHat;
      loadSavedOffsetOrZero();
      renderClosetGrid(); drawStage();
    };
    document.getElementById("btnUndress").onclick = () => {
      state.bodyId = null; state.hatId = null; state.showHat = false;
      state.hatX = 0; state.hatY = 0;
      syncHatInputs(); renderClosetGrid(); drawStage();
    };

    function downloadCanvas(canvas, filename) {
      const a = document.createElement("a");
      a.download = filename;
      a.href = canvas.toDataURL("image/png");
      a.click();
    }

    document.getElementById("btnSaveChar64").onclick = () => {
      const c = compose64(true);
      downloadCanvas(c, `${state.charId}_${state.bodyId || "base"}_hat_${state.hatId || "none"}_64.png`);
    };
    document.getElementById("btnSaveClothes64").onclick = () => {
      const c = compose64(false);
      downloadCanvas(c, `outfit_${state.bodyId || "none"}_hat_${state.hatId || "none"}_x${state.hatX}_y${state.hatY}_64.png`);
    };
    document.getElementById("btnSaveBig").onclick = () => {
      const small = compose64(true);
      const big = document.createElement("canvas");
      big.width = 512; big.height = 512;
      const bctx = big.getContext("2d");
      bctx.imageSmoothingEnabled = false;
      bctx.drawImage(small, 0, 0, 512, 512);
      downloadCanvas(big, `${state.charId}_${state.bodyId || "base"}_512.png`);
    };

        document.getElementById("btnTheme").onclick = () => {
      const dark = document.documentElement.classList.toggle("dark");
      document.getElementById("btnTheme").textContent = dark ? "☀️ 라이트모드" : "🌙 다크모드";
      drawStage();
    };
    window.addEventListener("themechange", drawStage);

    (async () => {
      await preloadAll();
      updateTabsAndFilters();
      renderCharBar();
      loadSavedOffsetOrZero();
      renderClosetGrid();
      drawStage();
    })();
  </script>
</body>
</html>
